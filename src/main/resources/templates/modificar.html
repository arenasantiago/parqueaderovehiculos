<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ParkNeon - Modificar')}"></head>
<body>
    <nav th:replace="~{fragments :: navbar('lista')}"></nav>

    <main class="contenido container py-4">
        <div class="caja-titulo mb-4">
            <h1 class="titulo-neon">Modificar vehículo</h1>
        </div>

        <div class="tarjeta mx-auto mb-4" style="max-width: 480px;" th:if="${'Moto'.equals(tipovehiculo)}">
            <form th:action="@{/servicioModificado/{id}(id = ${id})}" method="post" th:object="${vehiculo}">
                <h2 class="text-center">Casco</h2>
                <div class="d-flex justify-content-center gap-4 mt-3">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="cascoSi" value="true" th:field="*{casco}">
                        <label class="form-check-label" for="cascoSi">Sí</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="cascoNo" value="false" th:field="*{casco}">
                        <label class="form-check-label" for="cascoNo">No</label>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-neon">Continuar</button>
                </div>
            </form>
        </div>

        <div class="tarjeta mx-auto mb-4" style="max-width: 480px;" th:if="${'Carro'.equals(tipovehiculo)}">
            <form th:action="@{/servicioModificado/{id}(id = ${id})}" method="post" th:object="${vehiculo}">
                <h2 class="text-center">Lavado</h2>
                <div class="d-flex justify-content-center gap-4 mt-3">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="lavadoSi" value="true" th:field="*{lavado}">
                        <label class="form-check-label" for="lavadoSi">Sí</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="lavadoNo" value="false" th:field="*{lavado}">
                        <label class="form-check-label" for="lavadoNo">No</label>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-neon">Continuar</button>
                </div>
            </form>
        </div>

        <div class="tarjeta mx-auto" style="max-width: 480px;" th:if="${!desapareceForm}">
            <form th:action="@{/modificar/modificando/{id}(id=${id})}" method="post" th:object="${vehiculo}">
                <div class="mb-3">
                    <label for="placaActual" class="form-label">Placa actual</label>
                    <input type="text" id="placaActual" class="form-control-oscuro w-100" th:value="${placaAModificar}" readonly>
                </div>
                <div class="mb-3">
                    <label for="placaNueva" class="form-label">Placa nueva</label>
                    <input type="text" id="placaNueva" class="form-control-oscuro w-100" maxlength="6"
                        autocomplete="off" th:field="*{placa}" th:placeholder="${placaAModificar}">
                </div>
                <div class="mb-3">
                    <label for="horaNueva" class="form-label">Hora nueva</label>
                    <input type="time" id="horaNueva" class="form-control-oscuro w-100" th:field="*{hora}">
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-neon w-100">Confirmar</button>
                </div>
            </form>
        </div>

        <div class="text-center mt-4" th:if="${resultado != null}">
            <div class="alert d-inline-block mb-0"
                th:classappend="${resultado.contains('éxito')} ? 'alert-success' : 'alert-danger'">
                <h4 class="mb-0" th:text="${resultado}"></h4>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
    <th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
