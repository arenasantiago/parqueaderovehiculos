<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ParkNeon - Inicio')}"></head>
<body>
    <nav th:replace="~{fragments :: navbar('inicio')}"></nav>

    <main class="contenido container py-4">
        <div class="hero caja-titulo mb-4">
            <img class="logo-hero mb-3" th:src="@{/img/iconpark.jpg}" alt="Logo ParkNeon">
            <h1 class="titulo-neon display-3">ParkNeon</h1>
            <p class="slogan mb-0">Parqueadero de motos y carros · Parquea seguro con nosotros</p>
        </div>

        <div class="tarjeta mx-auto mb-4" style="max-width: 480px;" th:if="${'Moto'.equals(tipovehiculo)}">
            <form th:action="@{/servicio/{id}(id = ${id})}" method="post" th:object="${vehiculo}">
                <h2 class="text-center">Casco</h2>
                <div class="d-flex justify-content-center gap-4 mt-3">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="cascoSi" value="true" th:field="*{casco}">
                        <label class="form-check-label" for="cascoSi">Sí</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="cascoNo" value="false" th:field="*{casco}">
                        <label class="form-check-label" for="cascoNo">No</label>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-neon">Continuar</button>
                </div>
            </form>
        </div>

        <div class="tarjeta mx-auto mb-4" style="max-width: 480px;" th:if="${'Carro'.equals(tipovehiculo)}">
            <form th:action="@{/servicio/{id}(id = ${id})}" method="post" th:object="${vehiculo}">
                <h2 class="text-center">Lavado</h2>
                <div class="d-flex justify-content-center gap-4 mt-3">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="lavadoSi" value="true" th:field="*{lavado}">
                        <label class="form-check-label" for="lavadoSi">Sí</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="lavadoNo" value="false" th:field="*{lavado}">
                        <label class="form-check-label" for="lavadoNo">No</label>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-neon">Continuar</button>
                </div>
            </form>
        </div>

        <div th:if="${desapareceForm}">
            <div class="row g-3 justify-content-center mb-4">
                <div class="col-md-4">
                    <div class="tarjeta-contador">
                        <i class="bi bi-car-front icono"></i>
                        <div class="cantidad" th:text="|${contadores.carros} / ${contadores.capacidadCarros}|">0 / 5</div>
                        <div class="etiqueta">Carros en el parqueadero</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="tarjeta-contador">
                        <i class="bi bi-emoji-sunglasses icono"></i>
                        <div class="cantidad" th:text="|${contadores.motos} / ${contadores.capacidadMotos}|">0 / 10</div>
                        <div class="etiqueta">Motos en el parqueadero</div>
                    </div>
                </div>
            </div>

            <div class="row g-3 justify-content-center mb-4">
                <div class="col-md-5">
                    <div class="tarjeta h-100">
                        <h3 class="text-center titulo-neon">Hora fracción</h3>
                        <ul class="list-unstyled mt-3 mb-0">
                            <li class="d-flex justify-content-between border-bottom pb-2 mb-2">
                                <span>Carro</span><strong>$7.000</strong>
                            </li>
                            <li class="d-flex justify-content-between">
                                <span>Moto</span><strong>$3.500</strong>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="tarjeta h-100">
                        <h3 class="text-center titulo-neon">Servicios</h3>
                        <ul class="list-unstyled mt-3 mb-0">
                            <li class="d-flex justify-content-between border-bottom pb-2 mb-2">
                                <span>Lavado de vehículos</span><strong>$30.000</strong>
                            </li>
                            <li class="d-flex justify-content-between">
                                <span>Casco</span><strong>$2.000</strong>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="tarjeta mx-auto" style="max-width: 480px;">
                <h3 class="text-center">Registrar vehículo</h3>
                <form th:action="@{/ingresar}" method="post" th:object="${vehiculo}" class="mt-3">
                    <div class="mb-3">
                        <label for="placa" class="form-label">Placa</label>
                        <input type="text" id="placa" class="form-control-oscuro w-100" maxlength="6"
                            placeholder="Ej: ABC123" autocomplete="off" required th:field="*{placa}">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-neon w-100">Ingresar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-4" th:if="${resultado != null}">
            <div class="alert d-inline-block mb-0"
                th:classappend="${resultado.contains('añadido')} ? 'alert-success' : 'alert-danger'">
                <h4 class="mb-0" th:text="${resultado}"></h4>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
    <th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
