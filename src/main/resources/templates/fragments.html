<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/x-icon" href="../img/iconpark.jpg">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <title th:text="${titulo}">ParkNeon</title>
</head>
<body>

    <nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <img class="logo-nav" th:src="@{/img/iconpark.jpg}" alt="Logo ParkNeon">
                ParkNeon
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active' : ''" th:href="@{/}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activo == 'lista'} ? 'active' : ''" th:href="@{/lista}">Lista</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer">
        <div class="footer">
            <div class="d-flex align-items-center justify-content-center mb-1">
                <img class="logo-footer" th:src="@{/img/iconpark.jpg}" alt="Logo ParkNeon">
                <h5 class="mb-0">ParkNeon - Enterprise</h5>
            </div>
            <small>Cra 0 # 0-00 · Tel: 300 000 0000 · Lunes a Sábado 6:00 a.m. - 8:00 p.m.</small>
        </div>
    </footer>

    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    </th:block>

</body>
</html>
