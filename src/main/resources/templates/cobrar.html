<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ParkNeon - Cobro')}"></head>
<body>
    <nav th:replace="~{fragments :: navbar('lista')}"></nav>

    <main class="contenido container py-4">
        <div class="caja-titulo mb-4">
            <h1 class="titulo-neon">Cobrar</h1>
        </div>

        <div class="tarjeta mx-auto" style="max-width: 480px;">
            <div class="text-center mb-3">
                <span class="form-label">Vehículo</span>
                <h3 th:text="${placaOriginal}"></h3>
            </div>
            <div class="text-center mb-4">
                <span class="form-label">Valor a cancelar</span>
                <h2 class="titulo-neon display-5" th:text="'$ ' + ${#numbers.formatDecimal(debePagar, 1, 0)}"></h2>
            </div>
            <form th:action="@{/cobrando/{id}(id=${id})}" method="post" th:object="${vehiculo}">
                <div class="mb-3">
                    <label for="pago" class="form-label">Pago</label>
                    <input type="number" id="pago" class="form-control-oscuro w-100" step="0.01" min="0"
                        autocomplete="off" required th:field="*{pago}">
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-neon w-100">Pagar</button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments :: footer}"></footer>
    <th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
